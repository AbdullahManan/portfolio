<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.png" type="image/png">
    <title>Abdullah Manan's Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7ad0bc;
            --dark-bg: #0f1419;
            --card-bg: #1a1f2e;
            --text-primary: #ffffff;
            --text-secondary: #b0b8c1;
            --border-color: #2a3142;
        }

        body {
            background: var(--dark-bg);
            color: var(--text-primary);
            font-family: system-ui, sans-serif;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary), #5ab89f);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            letter-spacing: 2px;
            font-size: 0.9rem;
        }

        .gallery-container {
            max-width: 1100px;
            margin: auto;
            padding: 50px 20px;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-secondary);
            cursor: pointer;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--primary);
            color: #000;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .photo-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
        }

        .photo-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(122,208,188,0.2);
        }

        .photo-image {
            height: 200px;
            overflow: hidden;
        }

        .photo-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }

        .photo-card:hover img {
            transform: scale(1.1);
        }

        .photo-info {
            padding: 15px;
        }

        .photo-title {
            font-weight: 600;
        }

        .photo-date {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        /* LIGHTBOX */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 999;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <p class="subtitle">Welcome to</p>
    <h1>Abdullah Manan's Gallery</h1>
</header>

<div class="gallery-container">

    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterPhotos('all')">All</button>
        <button class="filter-btn" onclick="filterPhotos('landscape')">Landscape</button>
        <button class="filter-btn" onclick="filterPhotos('portrait')">Portrait</button>
        <button class="filter-btn" onclick="filterPhotos('abstract')">Abstract</button>
    </div>

    <div class="gallery" id="gallery"></div>

</div>

<footer>
    © 2026 Abdullah Manan
    All Photos are subjected to Copyright.
</footer>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
    <img id="lightbox-img" src="">
</div>

<script>
const photos = [
    { id: 1, title: 'After Hailstrom', category: 'landscape', date: 'April 2026', src: "images/pic1.webp" },
    { id: 2, title: 'Red-Flower Tree', category: 'landscape', date: 'March 2026', src: "images/pic2.webp" },
    { id: 3, title: 'Campus Cat', category: 'portrait', date: 'Feb 2026', src: "images/pic3.webp" },
    { id: 4, title: 'B&W Jasmine', category: 'abstract', date: 'Jan 2026', src: "images/pic4.webp" },
    { id: 5, title: 'Sunset Drive', category: 'abstract', date: 'Jan 2026', src: "images/pic5.webp" },
    { id: 6, title: 'Ray of Hopes', category: 'abstract', date: 'Dec 2025', src: "images/pic6.webp" },
    { id: 7, title: 'A Cold 7am ', category: 'landscape', date: 'Dec 2025', src: "images/pic7.webp" },
    { id: 8, title: 'Flame', category: 'abstract', date: 'Nov 2025', src: "images/pic8.webp" },
    { id: 9, title: 'Night Glow', category: 'abstract', date: 'Nov 2025', src: "images/pic9.webp" },
    { id: 10, title: 'Tabebuia rosea', category: 'abstract', date: 'April 2025', src: "images/pic10.webp" }
];

const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

function renderPhotos(category = "all") {
    gallery.innerHTML = "";

    const filtered = category === "all"
        ? photos
        : photos.filter(p => p.category === category);

    filtered.forEach(photo => {
        const card = document.createElement("div");
        card.className = "photo-card";

        card.innerHTML = `
            <div class="photo-image">
                <img src="${photo.src}" alt="${photo.title}" loading="lazy">
            </div>
            <div class="photo-info">
                <div class="photo-title">${photo.title}</div>
                <div class="photo-date">${photo.date}</div>
            </div>
        `;

        card.addEventListener("click", () => {
            lightboxImg.src = photo.src;
            lightbox.classList.add("active");
        });

        gallery.appendChild(card);
    });
}

function filterPhotos(category) {
    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("active");
    });

    event.target.classList.add("active");
    renderPhotos(category);
}

lightbox.addEventListener("click", () => {
    lightbox.classList.remove("active");
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
        lightbox.classList.remove("active");
    }
});

renderPhotos();
</script>

</body>
</html>
